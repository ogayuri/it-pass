<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT PASS</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#176b80"><style>body{font:16px system-ui;background:#f0f5f8;color:#183349;max-width:700px;margin:auto;padding:18px}section{background:white;border-radius:16px;padding:18px;margin:14px 0}button,select,input{font:inherit;padding:12px;border:1px solid #b8cad6;border-radius:10px;background:white;margin:4px;max-width:100%}button{cursor:pointer}button.primary{background:#176b80;color:white}nav{display:flex;flex-wrap:wrap}progress{width:100%;accent-color:#176b80}small{color:#526879}h1{margin-bottom:0}label{display:block;margin:8px 0} .choice{display:block;width:100%;text-align:left;margin:8px 0}</style><h1>IT PASS</h1><small>12月26日 合格プロジェクト · Web版 0.2</small><nav id="nav"></nav><main id="main"><section>読み込み中です。画面が変わらない場合は、公開したURLをSafariで開いてください。</section></main><script>
const Q=[['テクノロジ','暗号','共通鍵暗号方式の特徴は？',['同じ鍵で暗号化と復号を行う','異なる鍵を必ず使う','鍵が不要','電子署名が必須'],0,'同じ秘密鍵を共有する。鍵の安全な配送が課題。'],['テクノロジ','ネットワーク','DNSの役割は？',['通信を暗号化する','ドメイン名とIPアドレスを対応させる','ファイルを圧縮する','電源を管理する'],1,'DNSは名前解決を行う。'],['テクノロジ','セキュリティ','フィッシングとは？',['バックアップ','通信速度測定','偽サイトなどで情報を盗む行為','データ圧縮'],2,'偽メールやサイトで認証情報などをだまし取る。'],['テクノロジ','基礎理論','2進数1010を10進数にすると？',['8','9','10','12'],2,'8+0+2+0=10。'],['テクノロジ','データベース','主キーの役割は？',['表を暗号化する','行を一意に識別する','通信を高速化する','画像を圧縮する'],1,'主キーは各行を一意に識別する。'],['ストラテジ','経営戦略','SWOT分析のSは？',['強み','弱み','機会','脅威'],0,'Strengthは内部環境の強み。'],['ストラテジ','財務','売上100万円、費用80万円の利益は？',['180万円','80万円','20万円','10万円'],2,'売上から費用を引く。'],['ストラテジ','企業活動','PDCAのCは？',['計画','実行','評価','改善'],2,'Checkは評価。'],['マネジメント','開発','ウォーターフォール型開発の特徴は？',['工程を順に進める','計画を一切しない','テストをしない','必ず毎日公開する'],0,'要件定義、設計、実装、テストなどを順に進める。'],['マネジメント','サービス管理','SLAとは？',['暗号方式','サービス品質に関する合意','会計基準','プログラム言語'],1,'提供者と利用者のサービス水準の合意。'],['マネジメント','プロジェクト管理','WBSの目的は？',['作業を分解して整理する','通信を暗号化する','利益を計算する','顧客を分類する'],0,'成果物や作業を階層的に分解する。'],['テクノロジ','セキュリティ','多要素認証の例は？',['パスワードを2回入力','パスワードと指紋','同じPINを2回入力','秘密の質問を2つ'],1,'知識・所持・生体の異なる要素を組み合わせる。']];
let s={log:[],minutes:[],cards:[]};try{s=JSON.parse(localStorage.getItem('itpass')||'null')||s}catch{};const save=()=>{try{localStorage.setItem('itpass',JSON.stringify(s))}catch{alert('端末に保存できません。データを書き出してください')}};const m=document.querySelector('#main');let mode='all',idx=0,queue=[],selected=-1;const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function home(){let n=s.log.length,k=s.log.filter(x=>x.ok).length; m.innerHTML=`<section><h2>学習ダッシュボード</h2><p>回答数 ${n} ／ 正答率 ${n?Math.round(k/n*100)+'%':'未測定'}</p><p>累計学習 ${s.minutes.reduce((a,b)=>a+b.m,0)}分</p>${['ストラテジ','マネジメント','テクノロジ'].map(f=>{let a=s.log.filter(x=>Q[x.id]?.[0]===f),p=a.length?Math.round(a.filter(x=>x.ok).length/a.length*100):0;return `<p>${f} ${a.length?p+'%':'未測定'}<progress max=100 value=${p}></progress></p>`}).join('')}<h3>学習時間（直近7日）</h3>${Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let key=d.toLocaleDateString('ja-JP'),v=s.minutes.filter(x=>x.d===key).reduce((a,b)=>a+b.m,0);return `<p>${key} ${v}分<progress max=${Math.max(240,v)} value=${v}></progress></p>`}).join('')}<p>次の学習：${n?'不正解・自信のない問題を復習':'まず練習問題を解く'}</p></section><section><h3>学習時間を記録</h3><input id=min type=number min=1 max=1440 placeholder="分"><button onclick="record()">記録</button></section>`}function record(){let v=Number(document.querySelector('#min').value);if(v>0&&v<=1440){s.minutes.push({d:new Date().toLocaleDateString('ja-JP'),m:v});save();home()}}function start(weak=false){let latest={};s.log.forEach(x=>latest[x.id]=x);queue=Q.map((_,i)=>i).filter(i=>!weak||(latest[i]&&(!latest[i].ok||latest[i].conf!=='high')));idx=0;quiz()}function quiz(){selected=-1;if(idx>=queue.length){m.innerHTML='<section>演習終了、または対象問題がありません。<button onclick="home()">結果を見る</button></section>';return}let q=Q[queue[idx]];m.innerHTML=`<section><small>${q[0]} / ${q[1]} · ${idx+1}/${queue.length}</small><h2>${q[2]}</h2>${q[3].map((x,i)=>`<button class=choice onclick="pick(${i},this)">${esc(x)}</button>`).join('')}<label>自信度<select id=conf><option value="" selected>自信度を選択</option><option value=high>理由まで理解</option><option value=mid>なんとなく</option><option value=low>勘</option></select></label><button class=primary onclick="answer()">回答</button><div id=result></div></section>`}function pick(i,b){selected=i;document.querySelectorAll('.choice').forEach(x=>x.style.background='white');b.style.background='#cce9ed'}function answer(){if(selected<0)return;let id=queue[idx],q=Q[id],conf=document.querySelector('#conf').value,ok=selected===q[4];if(!conf){alert("自信度を選択してください");return} s.log.push({id,ok,conf,date:new Date().toISOString()});save();document.querySelectorAll('#main button').forEach(b=>b.disabled=true);document.querySelector('#result').innerHTML=`<h3>${ok?'正解':'不正解'}</h3><p>正解：${q[3][q[4]]}</p><p>${q[5]}</p><button onclick="idx++;quiz()">次へ</button>`}function cards(){m.innerHTML='<section><h2>暗記カード</h2>'+Q.map(q=>`<details><summary>${esc(q[1])}：${esc(q[2])}</summary><p>${esc(q[5])}</p></details>`).join('')+'</section>'}function data(){m.innerHTML='<section><h2>データ移行</h2><p>学習記録はこのブラウザに保存されます。消失に備えてJSONをファイルアプリに保存してください。読み込みは現在の記録を上書きします。</p><button onclick="exportData()">書き出す</button><input type=file accept=".json,application/json" onchange="importData(this)"></section>'}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='itpass-data.json';a.click()}async function importData(el){try{let v=JSON.parse(await el.files[0].text());if(!Array.isArray(v.log)||!Array.isArray(v.minutes))throw Error();if(confirm('現在の記録を上書きしますか？')){s=v;save();home()}}catch{alert('読み込めません')}}document.querySelector('#nav').innerHTML='<button onclick="home()">ホーム</button><button onclick="start()">演習</button><button onclick="start(true)">苦手復習</button><button onclick="cards()">暗記カード</button><button onclick="data()">データ</button>';home();</script></html>
