{i},this)">${esc(x)}</button>`).join('')}<label>自信度<select id=conf><option value="" selected>自信度を選択</option><option value=high>理由まで理解</option><option value=mid>なんとなく</option><option value=low>勘</option></select></label><button class=primary onclick="answer()">回答</button><div id=result></div></section>`}function pick(i,b){selected=i;document.querySelectorAll('.choice').forEach(x=>x.style.background='white');b.style.background='#cce9ed'}function answer(){if(selected<0)return;let id=queue[idx],q=Q[id],conf=document.querySelector('#conf').value,ok=selected===q[4];if(!conf){alert("自信度を選択してください");return} s.log.push({id,ok,conf,date:new Date().toISOString()});save();document.querySelectorAll('#main button').forEach(b=>b.disabled=true);document.querySelector('#result').innerHTML=`<h3>${ok?'正解':'不正解'}</h3><p>正解：${q[3][q[4]]}</p><p>${q[5]}</p><button onclick="idx++;quiz()">次へ</button>`}function cards(){m.innerHTML='<section><h2>暗記カード</h2>'+Q.map(q=>`<details><summary>${esc(q[1])}：${esc(q[2])}</summary><p>${esc(q[5])}</p></details>`).join('')+'</section>'}function data(){m.innerHTML='<section><h2>データ移行</h2><p>学習記録はこのブラウザに保存されます。消失に備えてJSONをファイルアプリに保存してください。読み込みは現在の記録を上書きします。</p><button onclick="exportData()">書き出す</button><input type=file accept=".json,application/json" onchange="importData(this)"></section>'}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:'application/json'}));a.download='itpass-data.json';a.click()}async function importData(el){try{let v=JSON.parse(await el.files[0].text());if(!Array.isArray(v.log)||!Array.isArray(v.minutes))throw Error();if(confirm('現在の記録を上書きしますか？')){s=v;save();home()}}catch{alert('読み込めません')}}
